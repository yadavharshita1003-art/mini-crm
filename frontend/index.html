<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRM Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <h1>📋 Mini CRM</h1>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <!-- Add Lead Form -->
    <div class="card">
      <h3 style="margin-bottom:15px;">➕ Add New Lead</h3>
      <label>Name</label>
      <input type="text" id="name" placeholder="Full name">
      <label>Email</label>
      <input type="email" id="email" placeholder="Email address">
      <label>Phone</label>
      <input type="text" id="phone" placeholder="Phone number">
      <label>Source</label>
      <input type="text" id="source" placeholder="e.g. Website, Instagram">
      <button class="btn btn-success" onclick="addLead()">Add Lead</button>
    </div>

    <!-- Leads Table -->
    <div class="card">
      <div class="top-bar">
        <h2>All Leads</h2>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Source</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leadsTable">
          <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API = 'https://mini-crm-xx4g.onrender.com/api';
    const token = localStorage.getItem('token');

    if (!token) window.location.href = 'login.html';

    async function loadLeads() {
      const res = await fetch(`${API}/leads`, {
        headers: { 'authorization': token }
      });
      const leads = await res.json();
      const tbody = document.getElementById('leadsTable');

      if (leads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No leads yet!</td></tr>';
        return;
      }

      tbody.innerHTML = leads.map(lead => `
        <tr>
          <td>${lead.name}</td>
          <td>${lead.email}</td>
          <td>${lead.phone || '-'}</td>
          <td>${lead.source}</td>
          <td><span class="badge badge-${lead.status}">${lead.status}</span></td>
          <td>
            <button class="btn-danger" onclick="viewLead('${lead._id}')">View</button>
          </td>
        </tr>
      `).join('');
    }

    async function addLead() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const source = document.getElementById('source').value;

      if (!name || !email) {
        alert('Name and Email are required!');
        return;
      }

      await fetch(`${API}/leads`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'authorization': token
        },
        body: JSON.stringify({ name, email, phone, source })
      });

      // Clear fields
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('source').value = '';

      loadLeads();
    }

    function viewLead(id) {
      window.location.href = `lead.html?id=${id}`;
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    loadLeads();
  </script>

</body>
</html>
