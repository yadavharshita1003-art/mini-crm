<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lead Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <h1>📋 Mini CRM</h1>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <div class="card">
      <div class="top-bar">
        <h2>Lead Details</h2>
        <button class="btn-add" onclick="window.location.href='index.html'">← Back</button>
      </div>

      <label>Name</label>
      <input type="text" id="name">
      <label>Email</label>
      <input type="email" id="email">
      <label>Phone</label>
      <input type="text" id="phone">
      <label>Source</label>
      <input type="text" id="source">
      <label>Status</label>
      <select id="status">
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="converted">Converted</option>
      </select>
      <label>Notes</label>
      <textarea id="notes" rows="4" placeholder="Add notes here..."></textarea>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-success" onclick="updateLead()">💾 Save Changes</button>
        <button class="btn btn-danger" onclick="deleteLead()">🗑️ Delete Lead</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8000/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    // Get lead ID from URL
    const id = new URLSearchParams(window.location.search).get('id');

    async function loadLead() {
      const res = await fetch(`${API}/leads/${id}`, {
        headers: { 'authorization': token }
      });
      const lead = await res.json();

      document.getElementById('name').value = lead.name;
      document.getElementById('email').value = lead.email;
      document.getElementById('phone').value = lead.phone || '';
      document.getElementById('source').value = lead.source || '';
      document.getElementById('status').value = lead.status;
      document.getElementById('notes').value = lead.notes || '';
    }

    async function updateLead() {
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        source: document.getElementById('source').value,
        status: document.getElementById('status').value,
        notes: document.getElementById('notes').value
      };

      await fetch(`${API}/leads/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'authorization': token
        },
        body: JSON.stringify(body)
      });

      alert('Lead updated successfully!');
      window.location.href = 'index.html';
    }

    async function deleteLead() {
      if (!confirm('Are you sure you want to delete this lead?')) return;

      await fetch(`${API}/leads/${id}`, {
        method: 'DELETE',
        headers: { 'authorization': token }
      });

      alert('Lead deleted!');
      window.location.href = 'index.html';
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    loadLead();
  </script>

</body>
</html>
